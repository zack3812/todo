name = "nexusdesk-cloud"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 自定义域名
routes = [{ pattern = "nexusdesk.dpdns.org/*", zone_name = "nexusdesk.dpdns.org" }]

# 环境变量（敏感信息用 wrangler secret put，不要写在这里）
[vars]
DINGTALK_APP_KEY = ""

# D1 数据库（主存储：用户 / 会话 / 待办）
[[d1_databases]]
binding = "DB"
database_name = "nexusdesk-db"
database_id = "9281e7e5-1560-4514-b53b-fb1a465ee72f"

# WebSocket 枢纽（Durable Object）：单实例持有连接与在线状态，保证跨请求广播可靠送达
[[durable_objects.bindings]]
name = "WS_HUB"
class_name = "WsHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WsHub"]
